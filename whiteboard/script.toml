# 《组织人的一天》文案
#
# 改完后重新运行：python3 whiteboard/day.py
# （旁白改了会自动重新合成；场景会自动拉长到能念完旁白。）
#
# narration  旁白，念出来的话。数字写成汉字读得更自然（“六点四十五分”）；
#            按句号、问号、感叹号切句，句间自动停顿。书名号、间隔号“·”念不出来，别用。
# captions   画面顶部的字幕。第一行是时间地点（大字），后面最多两行说明。
#            每行太长会自动缩小字号，建议不超过 36 个字。
# 其他字段   画在画面里的字（标牌、对话框、试卷等），位置固定，尽量保持原有长度。

[title_card]
title = "组织人的一天"
subtitle = "1956 年 · 美国"
narration = "一九五六年，记者威廉怀特出版了一本书，书名叫，组织人。这是书里那种人的一天。"

[morning]
captions = [
  "上午 6:45 · 帕克森林，芝加哥郊外",
  "三栋一样的房子，三辆一样的车，",
  "三扇门在同一分钟打开。",
]
narration = """早上六点四十五分，芝加哥郊外的帕克森林。\
这里的房子出自同一张图纸，车道上停着同一款新车。\
三扇门在同一分钟打开，丈夫们提着同样的公文包出门，妻子们站在门口挥手。\
在这里，和邻居不一样，才是需要解释的事。"""

[train]
captions = [
  "上午 7:32 · 开往芝加哥的通勤火车",
  "同一班车，同一份报纸，同一个姿势。",
  "车厢里很安静——没有人需要开口。",
]
narration = """七点三十二分，开往芝加哥的通勤火车。\
每个人都坐在习惯的位置上，翻开同一份报纸。\
没有人交谈，也不需要交谈。他们要去的，其实是同一个地方。"""

[office]
captions = [
  "上午 8:59 · 公司总部",
  "他不只是为组织工作——他属于组织。",
]
bottom = "同样的帽子，同样的公文包，同样的 9:00。"   # 画面底部那行字
company = "CONSOLIDATED CORP."                       # 大楼招牌
bar = "组织"                                         # 提线木偶横杆上的字
narration = """八点五十九分，公司总部。大钟就要指向九点，一排一模一样的人走进同一扇门。\
怀特说，这些人不只是为组织工作，他们在精神上也属于组织。\
他们把前途、身份，甚至想法，都交给了它。"""

[personality_test]
captions = [
  "上午 10:30 · 人事部的人格测试",
  "正确答案永远是：最合群的那一个。",
  "怀特在书末附了一篇《如何在人格测试中作弊》。",
]
q1 = "人格测试 · 第 37 题"
q1_a = "我喜欢一个人安静地读书。"
q1_b = "我喜欢参加聚会和团体活动。"        # 打勾的选项
q2 = "第 38 题"
q2_a = "我常常怀疑上司的决定。"
q2_b = "我相信公司知道什么对我最好。"      # 打勾的选项
verdict = "合群 · 适应良好"                 # 试卷右下角的评语
narration = """上午十点半，人事部的人格测试。\
你喜欢一个人读书，还是参加团体活动？\
你会怀疑上司，还是相信公司知道什么对你最好？\
正确答案只有一个：最合群的那一个。\
怀特在书末甚至教读者如何作弊。尽量显得平庸、乐观、毫无棱角。"""

[meeting]
captions = [
  "下午 2:00 · 委员会会议",
  "他想说的话，留在了心里。",
  "群体被当作智慧的源泉；异议，则被当作“不合群”。",
]
boss = "大家都同意吧？"                     # 上司的对话框
reply = "同意"                              # 每个人的对话框
thought = "其实我觉得……"                    # 他的思考气泡
narration = """下午两点，委员会会议。上司问：大家都同意吧？每个人都说，同意。\
他心里其实有不同的想法，但他也说了，同意。\
在组织里，群体被当作智慧的源泉，而个人的异议，只会被看成不合群。"""

[party]
captions = [
  "傍晚 6:30 · 后院的烧烤聚会",
  "公司一纸调令，他就搬家。",
  "反正下一个郊区，也一模一样。",
]
letter = [                                  # 调令卡片上的字，从上到下
  "CONSOLIDATED CORP.",
  "人事调令",
  "自下月 1 日起，",
  "调往堪萨斯城分部。",
  "请携家眷准时报到。",
  "—— 人事部",
]
narration = """傍晚六点半，后院的烧烤聚会。邻居们聊着草坪、新车和升职。\
这时，他收到一纸调令：下个月，调往堪萨斯城。他不会拒绝。\
反正下一个郊区，也会有一样的房子，一样的邻居，一样的聚会。"""

[night]
captions = [
  "晚上 10:30",
  "西装挂好，公文包放好，闹钟定在 6:30。",
  "明天，再来一遍。",
]
narration = "晚上十点半。西装挂好，公文包放好，闹钟定在六点半。明天，再来一遍。"

[end_card]
title = "他属于组织。"
source = "参考：威廉·H·怀特《组织人》（The Organization Man, 1956）"
narration = "他得到了安稳的一生。代价是，他属于组织。"
