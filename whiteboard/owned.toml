# 《我归组织所有》文案与节奏 —— 八十秒上下的白板手绘短视频
#
# 改完后重新运行：python3 whiteboard/owned.py
# （旁白改了会自动重新合成；某一拍念不完时，这一拍会自动拉长，后面的整体往后挪。）
#
# 怎么改：只改引号里的字，其他结构不用动。
#
# time       这一拍原定的起止时间（秒），照你定的叙事节奏排的，一般不用改。
#            旁白念不完会顺延，所以实际时间可能比这里晚几秒。
# narration  旁白，主角第一人称。语速按每秒约 4 个字估算（已算上句间停顿），
#            这一拍几秒就乘 4，就是大概能念完的字数（不算标点）。
#            超出了也不会提速，只是这一拍变长；想守住节奏就删几个字。
#            数字写成汉字（“七点半”）；书名号、间隔号“·”念不出来，旁白里别用。
#            句号、问号、感叹号处会自动停顿。
#            画面是跟着小句（逗号、分号、冒号、句号隔开的一小段）一样一样画出来的，
#            改旁白时尽量保持标点个数不变，画面就能继续对上。
# scene      画面说明，我照着它画。想改画面，直接改这段描述。
# 其他字段   画进画面里的字（吊牌、公告栏、对话框等），可以用阿拉伯数字，尽量保持原有长度。
# # 依据     跟原书的对应，只是备注，不进视频。
#
# 底部字幕直接用旁白生成，不用另外写。

[settings]
title = "我归组织所有"                          # 片名，只用作文件名，不单独占时间
# 旁白的声音：
#   女声   voice = "clear"                  和《组织人的一天》同一个声音。女声念男人的第一人称，
#                                           像在朗诵别人的故事，留出距离感（现在用的是这个）
#   男声A  voice = "male",   speaker = 60   Kokoro 男声念参考句，ZipVoice 照着念
#   男声B  voice = "male",   speaker = 62
#   男声C  voice = "kokoro", speaker = 60   直接用 Kokoro 男声，偏慢，会被提速
#   男声D  voice = "kokoro", speaker = 62
#   也可以 voice = "zipvoice" 模仿你自己的录音，需要再填 prompt_wav 和 prompt_text（见 script.toml 的说明）
voice = "clear"
subtitles = true      # 底部同步字幕


# ================================================================ 第一部分：噱头（0–3 秒）

[hook]
time = [0, 3]         # 3 秒 ≈ 12 字
narration = "我归组织所有，我在美国。"
scene = """几笔画出一个穿西装的小人（主角），脖子上挂一个商品吊牌；
右上角一面小星条旗，旗下写着年代，表明这是历史上的美国。
这个吊牌是全片的符号，结尾会再出现一次。"""
tag = ["资产编号 1956-0417", "归属：联合公司"]   # 吊牌上的两行字
era = "1950 年代 · 美国"                        # 星条旗下的字

# 需求补充：开场三秒的画面，加个“1950年代”字样，表明这个是历史上的美国，不是当下的美国。


# ================================================================ 第二部分：组织人的生活（3–30 秒）

[identity]
time = [3, 6]         # 身份细节，坐实人设。3 秒 ≈ 12 字
narration = "灰西装，公文包，七点半的火车。"
scene = "在主角身上标出西装和公文包；右边几笔拉出一列通勤火车，站台钟指着 7:30。"
suit = "灰色法兰绒西装"
briefcase = "公文包"
watch = "7:30"
# 依据：1955 年的小说《穿灰色法兰绒套装的人》，灰西装是那个年代组织人的标志。

[competition]
time = [6, 12]        # 社会竞争，三个情绪点。6 秒 ≈ 24 字
narration = "同期的比尔，升了副经理。隔壁琼斯家，换了新车。我的考评：中等。"
scene = """三格速写依次出现：
① 公告栏，旁边一个向上的箭头；
② 隔壁车道上一辆系着蝴蝶结的新车，下面一行小字解释“琼斯家”这个俗语；
③ 一张考评表，“中等”被圈出来，旁边的主角额头冒汗。"""
board = ["晋升公告", "比尔 → 副经理"]
car_tag = "NEW"
joneses = "美国俗语 keeping up with the Joneses（跟邻居攀比）"
review = ["年度考评", "中等"]
# 依据：“琼斯家”来自美国俗语 keeping up with the Joneses（跟邻居攀比）；
#       考评对应怀特批评的人格测试和“全面型人才”。
# 需求补充：“琼斯家”这个美国俗语，在画面上出一部分解释一下，展示“美国俗语 keeping up with the Joneses（跟邻居攀比）”这么一行就行


[fed_up]
time = [12, 15]       # 厌烦，但走不掉。3 秒 ≈ 12 字
narration = "我烦透了这场比赛，可我走不掉。"
scene = "主角垂着手站在中间，叹了口气。接下来三拍，三样束缚一样一样加到他身上。"

[bind_bills]
time = [15, 20]       # 束缚①：钱。5 秒 ≈ 20 字
narration = "分期付款：房子、汽车、冰箱，每月一号，账单准时上门。"
scene = "脚踝上的锁链拴着一个铁球，铁球上写字；旁边一本日历。"
ball = "分期账单"
calendar = "每月 1 日"

[bind_pension]
time = [20, 25]       # 束缚②：制度。5 秒 ≈ 20 字
narration = "养老金：要干满二十年才能领，我才干了九年。"
scene = "手腕上一副手铐，铐链连着一个保险箱，箱上写字；下面一根进度条，停在九格。"
cuff = "养老金"
progress = "9 / 20 年"
# 依据：那时的企业养老金大多带不走，中途离职就拿不到；直到 1974 年才有联邦法律（ERISA）管这件事。

[bind_people]
time = [25, 30]       # 束缚③：人情。5 秒 ≈ 20 字
narration = "还有：太太的牌友、孩子的玩伴，全是公司里的人。"
scene = "主角头顶罩着一张网，网结上是太太、孩子、邻居的小人，网绳另一头都系在公司大楼上。"
building = "联合公司"


# ================================================================ 第三部分：无效挣扎（30–50 秒）

[try1]
time = [30, 40]       # 第一次挣扎，失败。10 秒 ≈ 40 字
narration = "我也努力过。大会上，我提出自己的方案。委员会讨论三个月，它却只变成一份谁都同意，但谁也记不住的报告。"
scene = """主角举着一个发光的灯泡（他的方案）。
灯泡被投进一台标着“委员会”的绞肉机，旁边日历翻过三页；
出口掉出一大摞报告，盖着一个章。"""
grinder = "委员会"
calendar = "3 个月"
stamp = "全体同意"
# 依据：第五章——人们在群体里交谈、交换信息、妥协，但不思考，也不创造。



[try2]
time = [40, 50]       # 鼓起勇气，第二次挣扎，再次失败。10 秒 ≈ 40 字
narration = "还有一次，我鼓起勇气，写好辞职信，走进经理办公室。他没生气，笑着拍拍我：公司需要你。然后，给我换了个更小的座位。"
scene = """主角拿着辞职信，推开经理办公室的门；经理笑着拍拍他的肩，冒出对话框。
画面一转：他原来靠窗的座位被打了叉；新座位挤在柱子后面的角落，
桌子只剩一半大，两边的隔板向他压过来。没有人对他做什么，可他越来越喘不过气。"""
letter = "辞职信"
door = "经理"
boss = "公司需要你！"
seat_old = "靠窗"
seat_new = "柱子后面"
# 依据：导论——社会伦理让来自群体的压力变得理所当然。没有人惩罚你，只是你的位置悄悄变了。
# 需求补充：写无形的窒息吧，不写善意了

# ================================================================ 第四部分：认命（50–60 秒）

[acceptance]
time = [50, 60]       # 一个事件让主角认命。10 秒 ≈ 40 字
narration = "晚上，儿子的作文写着：我的理想，是像爸爸一样，进一家大公司。我把辞职信，扔进了壁炉。"
scene = """一张作文纸，孩子的字；下面一幅儿童画：大楼前一个拿公文包的小人。
然后右边画出壁炉，辞职信落进火里。"""
essay = ["我的理想", "我要像爸爸一样，", "进一家大公司！"]   # 作文纸上的字，从上到下


# ================================================================ 第五部分：幻想（60–70 秒）

[dream]
time = [60, 70]       # 一连串挣脱束缚的幻想。10 秒 ≈ 40 字
narration = "有时我会想：小店开成全美连锁，我成了大富翁；一路向西，成了西部的孤胆英雄；在会上站起来说：我不同意。"
scene = """主角坐在壁炉前，头顶冒出一朵大思考云，云里依次画出：
① 一家挂着连锁招牌的店，门口堆着钱袋；
② 夕阳、仙人掌，戴牛仔帽、别着警长星的他；
③ 会议桌前他站起来，冒出对话框，其他人都吓了一跳。
三个画面一样大——在他心里，第三个和前两个一样遥不可及。"""
shop = "全美连锁 · 第 1000 家"
hero = "孤胆英雄"
speech = "我不同意！"
# 依据：大富翁、西部孤胆英雄，都是美国式个人奋斗的神话（第二章的新教伦理）；
#       “在会上说不同意”跟它们排在一起，显得一样不可能。
# 需求补充：你这不叫幻想，都做梦了，不能胆子再大一点吗？开店要做成大富翁，向西要成为牛仔英雄（虽然不一定要是牛仔，这只是个比喻），第三个不变，因为第三个的幻想程度，和前面的两个相当，所以显得更不可能

# ================================================================ 第六部分：收尾，留白（70–75 秒）

[ending]
time = [70, 75]       # 回到现实，再问一次。5 秒 ≈ 20 字；这句长，这一拍会拉长到 7 秒多
narration = "闹钟响了。系好领带，我想：不归组织，我又归谁呢？这一切真的没有其他出路吗？"
# 压到 5 秒内的版本：闹钟响了。不归组织，我又归谁？真的没有别的出路吗？
# 备选 B（最接地气）：闹钟响了。系好领带，我想：要是走了，一号的账单谁来付？
# 备选 C（接第四部分）：闹钟响了。系好领带，我想：儿子长大，也要过我这一辈子吗？
scene = """闹钟指着 6:30 响起来，几个小圈是刚散掉的思考云。
椭圆的镜子里，主角系好领带；念到“不归组织”时，他脖子上又挂上了那个吊牌。
右边留白，只有一个大问号。"""
clock = "6:30"
# 依据：呼应开头“我归组织所有”，问的正是第四章的“归属感”。


# ================================================================ 片尾：原书（75 秒起，没有旁白）

[end_card]
time = [75, 82]       # 7 秒：画书、写书里的一句话，再停两秒让人读完
scene = """左边一本立着的书，封面上是书名、英文原名，一排一模一样的小人，作者和年份。
右边写书里导论的一句话，正好回应开头的“我归组织所有”。配乐在这里慢慢收住。"""
title = "组织人"
subtitle = "The Organization Man"
author = "威廉·H·怀特"
year = "1956"
quote = ["“有的人只是为组织工作；", "我说的这些人，还属于组织。”"]
quote_from = "—— 威廉·H·怀特《组织人》导论"
# 依据：导论原文 These people only work for The Organization.
#       The ones I am talking about belong to it as well.
#       引文是我照英文译的，你手上的中译本如果译法不同，可以换成书里的原话。
# 想让片尾也念出来，在这里加一行 narration 就行，字幕会自动跟上。
