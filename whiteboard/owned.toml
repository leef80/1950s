# 《我归组织所有》文案与节奏 —— 75 秒白板手绘短视频（草稿，待定稿）
#
# 怎么改：只改引号里的字，其他结构不用动。
#
# time       这一拍在全片里的起止时间（秒）。照你定的叙事节奏排好了，一般不用改。
# narration  旁白，主角第一人称。语速按每秒约 4 个字估算（已算上句间停顿），
#            这一拍几秒就乘 4，就是大概能念完的字数（不算标点）。
#            超出一点没关系，我会把语速微调 10% 以内来对齐；超出太多就得删字。
#            数字写成汉字（“七点半”）；书名号、间隔号“·”念不出来，旁白里别用。
#            句号、问号、感叹号处会自动停顿。
# scene      画面说明，我照着它画。想改画面，直接改这段描述。
# 其他字段   画进画面里的字（吊牌、公告栏、对话框等），可以用阿拉伯数字，尽量保持原有长度。
# # 依据     跟原书的对应，只是备注，不进视频。
#
# 底部字幕直接用旁白生成，不用另外写。

[settings]
title = "我归组织所有"                          # 片名，只用作文件名，不单独占时间
source = "参考：威廉·H·怀特《组织人》，1956"   # 结尾角落的小字
voice = "male"        # 待定：本地中文男声（我先发几个试听给你挑），或用你录的 5–10 秒声音克隆
aspect = "16:9"       # 待定："9:16" 竖屏（抖音、视频号）或 "16:9" 横屏
subtitles = true      # 底部同步字幕


# ================================================================ 第一部分：噱头（0–3 秒）

[hook]
time = [0, 3]         # 3 秒 ≈ 12 字；超了一些，开头故意念快一点
narration = "我是一个组织人，我归组织所有，我在美国。"
scene = """几笔画出一个穿西装的小人（主角），脖子上挂一个商品吊牌，身后一面小星条旗。
这个吊牌是全片的符号，结尾会再出现一次。"""
tag = ["资产编号 1956-0417", "归属：联合公司"]   # 吊牌上的两行字

# 需求补充：开场三秒的画面，加个“1950年代”字样，表明这个是历史上的美国，不是当下的美国。


# ================================================================ 第二部分：组织人的生活（3–30 秒）

[identity]
time = [3, 6]         # 身份细节，坐实人设。3 秒 ≈ 12 字
narration = "灰西装，公文包，七点半的火车。"
scene = "镜头拉近主角：西装、公文包，手表指着 7:30，身后几笔拉出一列通勤火车。"
watch = "7:30"
# 依据：1955 年的小说《穿灰色法兰绒套装的人》，灰西装是那个年代组织人的标志。

[competition]
time = [6, 12]        # 社会竞争，三个情绪点。6 秒 ≈ 24 字；稍微超一点，念得紧凑些
narration = "同期的比尔，升了副经理。隔壁琼斯家，换了新车。我的考评：中等。"
scene = """三格速写依次出现，主角额头冒汗：
① 公告栏，旁边一个向上的箭头；
② 隔壁车道上一辆系着蝴蝶结的新车；
③ 一张考评表，“合群度：一般”被圈出来。"""
board = ["晋升公告", "比尔 → 副经理"]
car_tag = "NEW"
review = ["年度考评", "合群度：一般"]
# 依据：“琼斯家”来自美国俗语 keeping up with the Joneses（跟邻居攀比）；
#       “合群度”对应怀特批评的人格测试和“全面型人才”。
# 需求补充：“琼斯家”这个美国俗语，在画面上出一部分解释一下，展示“美国俗语 keeping up with the Joneses（跟邻居攀比）”这么一行就行


[fed_up]
time = [12, 15]       # 厌烦，但走不掉。3 秒 ≈ 12 字
narration = "我烦透了这场比赛，可我走不掉。"
scene = "主角叹气，三根锁链从画面外伸向他。"

[bind_bills]
time = [15, 20]       # 束缚①：钱。5 秒 ≈ 20 字
narration = "分期付款：房子、汽车、冰箱，每月一号，账单准时上门。"
scene = "脚踝上的锁链拴着一个铁球，铁球上写字；旁边一本日历。"
ball = "分期账单"
calendar = "每月 1 日"

[bind_pension]
time = [20, 25]       # 束缚②：制度。5 秒 ≈ 20 字
narration = "养老金：要干满二十年才能领，我才干了九年。"
scene = "手腕上一副手铐，挂着牌子；旁边一根进度条，停在九格。"
cuff = "养老金"
progress = "9 / 20 年"
# 依据：那时的企业养老金大多带不走，中途离职就拿不到；直到 1974 年才有联邦法律（ERISA）管这件事。

[bind_people]
time = [25, 30]       # 束缚③：人情。5 秒 ≈ 20 字
narration = "还有：太太的牌友、孩子的玩伴，全是公司里的人。"
scene = "主角身后一张网，网结上是太太、孩子、邻居的小人，网绳另一头都系在公司大楼上。"
building = "联合公司"


# ================================================================ 第三部分：无效挣扎（30–50 秒）

[try1]
time = [30, 40]       # 第一次挣扎，失败。10 秒 ≈ 40 字
narration = "我也努力过。大会上，我提出自己的方案。委员会讨论三个月，它却只变成一份谁都同意，但谁也记不住的报告。"
scene = """主角举着一个发光的灯泡（他的方案）。
灯泡被投进一台标着“委员会”的绞肉机，旁边日历翻过三页；
出口掉出一大摞报告，盖着一个章。"""
grinder = "委员会"
calendar = "3 个月"
stamp = "全体同意"
# 依据：第五章——人们在群体里交谈、交换信息、妥协，但不思考，也不创造。



[try2]
time = [40, 50]       # 鼓起勇气，第二次挣扎，再次失败。10 秒 ≈ 40 字
narration = "还有一次，我鼓起勇气，写好辞职信，走进经理办公室。他没生气，笑着拍拍我：公司需要你。然后，给我换了个更小的座位。"
scene = """主角写下辞职信，推开经理办公室的门。
经理笑着搂住他的肩，冒出对话框；递过来一张加薪的工资单。
辞职信被折好，塞回口袋（画一个箭头）。"""
letter = "辞职信"
door = "经理"
boss = "公司需要你！"
payslip = "+10%"
# 依据：导论——让组织人困惑的不是组织的恶，而是它的善意；他被困在“兄弟情谊”里。
#       这次失败不是被惩罚，而是被组织接住。
# 需求补充：写无形的窒息吧，不写善意了

# ================================================================ 第四部分：认命（50–60 秒）

[acceptance]
time = [50, 60]       # 一个事件让主角认命。10 秒 ≈ 40 字
narration = "晚上，儿子的作文写着：我的理想，是像爸爸一样，进一家大公司。我把辞职信，扔进了壁炉。"
scene = """一张方格作文纸，歪歪扭扭的童体字；旁边一幅儿童画：大楼前一个拿公文包的小人。
然后切到壁炉，辞职信落进火里。"""
essay = ["我的理想", "我要像爸爸一样，", "进一家大公司！"]   # 作文纸上的字，从上到下


# ================================================================ 第五部分：幻想（60–70 秒）

[dream]
time = [60, 70]       # 一连串挣脱束缚的幻想。10 秒 ≈ 40 字
narration = "有时我会想：开一家自己的木匠铺；带上一家人，一路向西，开到太平洋；在会上站起来说：我不同意。"
scene = """主角坐在壁炉前，头顶冒出一朵大思考云，云里依次画出：
① 挂着牌子的小木匠铺；
② 一辆车开向海浪和夕阳；
③ 会议桌前他站起来，冒出对话框。
同时，三根锁链在云里一根根断开。"""
shop = "OPEN"
road = "→ 太平洋"
speech = "我不同意！"
# 依据：木匠铺是新教伦理时代“自己当老板”的旧梦（第二章）；“向西”是美国的边疆神话。
# 需求补充：你这不叫幻想，都做梦了，不能胆子再大一点吗？开店要做成大富翁，向西要成为牛仔英雄（虽然不一定要是牛仔，这只是个比喻），第三个不变，因为第三个的幻想程度，和前面的两个相当，所以显得更不可能

# ================================================================ 第六部分：收尾，留白（70–75 秒）

[ending]
time = [70, 75]       # 回到现实，再问一次。5 秒 ≈ 20 字
narration = "闹钟响了。系好领带，我想：不归组织，我又归谁呢？这一切真的没有其他出路吗？"
# 备选 B（最接地气）：闹钟响了。系好领带，我想：要是走了，一号的账单谁来付？
# 备选 C（接第四部分）：闹钟响了。系好领带，我想：儿子长大，也要过我这一辈子吗？
scene = """闹钟指着 6:30 响起来，思考云“啪”地散成几个小圈。
主角对着镜子系领带，脖子上又是那个吊牌。
画面大片留白，只剩一个问号；角落写上参考书目（settings 里的 source）。"""
clock = "6:30"
# 依据：A 版呼应开头“我归组织所有”，问的正是第四章的“归属感”。
